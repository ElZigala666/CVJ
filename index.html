<script>
  // Aplicar el acento guardado antes de pintar nada (evita un parpadeo de color).
  try {
    var s = JSON.parse(localStorage.getItem('cvj.sesion') || 'null');
    var a = s && s.usuario && s.usuario.acento;
    if (a && /^#[0-9a-f]{6}$/i.test(a)) document.documentElement.style.setProperty('--acento-base', a);
  } catch (e) {}
</script>
