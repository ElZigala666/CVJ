<!-- Fondo, tema y acento ANTES de pintar nada (sin pantalla blanca ni parpadeos).
     js/apariencia.js deja en localStorage ("cvj.ap") las variables ya resueltas: aquí solo
     se ponen (en automático, la pareja de día o de noche según el sistema). -->
<style>
  html { background: var(--fondo, #FFFFFF); }
</style>
<script>
  (function () {
    var raiz = document.documentElement;
    try {
      var ap = JSON.parse(localStorage.getItem('cvj.ap') || 'null');
      var r = ap && (ap.auto ? (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? ap.oscuro : ap.claro) : ap.fija);
      if (!r) {
        // Primera vez (o sin sesión): lo de siempre, claro u oscuro según el sistema.
        var osc = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
        if (osc) raiz.setAttribute('data-tema', 'oscuro');
        document.getElementById('color-tema').setAttribute('content', osc ? '#121214' : '#FFFFFF');
        return;
      }
      for (var k in r.vars) raiz.style.setProperty(k, r.vars[k]);
      raiz.setAttribute('data-fondo', r.id);
      if (r.oscuro) raiz.setAttribute('data-tema', 'oscuro');
      if (r.imagen) raiz.setAttribute('data-img', '');
      if (r.sombra) raiz.setAttribute('data-sombra', '');
      document.getElementById('color-tema').setAttribute('content', r.color);
    } catch (e) {}
  })();
</script>
