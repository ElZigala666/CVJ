    if(estilo==='diagonal'){return tex+'linear-gradient(120deg, '+this.rot(acc,-40,0.32)+' 0%, '+acc+' 55%, '+this.rot(acc,40,0.6)+' 100%)';}
    if(estilo==='foco'){return tex+'radial-gradient(60% 130% at 70% 30%, '+this.rgba(acc,0.95)+' 0%, '+this.rgba(acc,0.25)+' 45%, transparent 75%), '+this.rot(acc,0,0.16);}
    return tex+'radial-gradient(70% 120% at 8% 0%, '+this.rgba(acc,0.9)+' 0%, transparent 60%), radial-gradient(60% 110% at 92% 6%, '+this.rgba(this.rot(acc,45),0.75)+' 0%, transparent 62%), radial-gradient(90% 120% at 55% 100%, '+this.rgba(this.rot(acc,-55),0.6)+' 0%, transparent 66%), '+this.rot(acc,0,0.22);}
  renderVals() {
    var self=this;var s=this.state;var acc=this.props.acento||'#FFE600';var set=function(o){self.setState(o);};
    var artes=[{label:'Arte',zoom:1,px:0,py:0},{label:'Captura 1',zoom:1.6,px:-14,py:6},{label:'Captura 2',zoom:1.45,px:16,py:-4}];
    var a=artes[s.arte];
    var thumbs={juego:'#6A3F55',imagen:'#2F5C8C',degradado:this.grad(acc,'malla'),patron:this.rot(acc,-20,0.2)};
    var modos=[['juego','Juego fav.'],['imagen','Tu imagen'],['degradado','Degradado'],['patron','Patrón']].map(function(x){return {label:x[1],thumb:thumbs[x[0]],bd:s.modo===x[0]?acc:'transparent',pick:function(){set({modo:x[0]});}};});
    var esJuego=s.modo==='juego',esImg=s.modo==='imagen',esGrad=s.modo==='degradado',esPat=s.modo==='patron';
    var gen=esGrad?this.grad(acc,s.estilo):('radial-gradient(80% 120% at 85% 0%, '+this.rgba(acc,0.55)+' 0%, transparent 65%), '+this.rot(acc,-20,0.16));
    return {acc:acc,on:this.lum(acc)>0.4?'#141218':'#FFFFFF',modos:modos,esJuego:esJuego,esImg:esImg,esGrad:esGrad,esPat:esPat,
      escena:esJuego||esImg,generado:esGrad||esPat,gen:gen,p1:this.rgba(acc,s.int),int:s.int,intTxt:Math.round(s.int*100)+'%',
      tipo:esImg?'foto':'juego',zoom:esImg?s.zoom:a.zoom,px:esImg?s.px:a.px,py:esImg?s.py:a.py,zoomTxt:Math.round(s.zoom*100)+'%',
      artes:artes.map(function(x,i){return {label:x.label,zoom:x.zoom,px:x.px,py:x.py,bd:i===s.arte?acc:'transparent',pick:function(){set({arte:i});}};}),
      estilos:[['malla','Malla'],['diagonal','Diagonal'],['foco','Foco']].map(function(x){return {label:x[1],css:self.grad(acc,x[0]),bd:s.estilo===x[0]?acc:'transparent',pick:function(){set({estilo:x[0]});}};}),
      onZoom:function(e){set({zoom:parseFloat(e.target.value)||1});},
      onInt:function(e){set({int:parseFloat(e.target.value)||0.2});},
      centrar:function(){set({px:0,py:0,zoom:1});}};
  }
}
</script>
