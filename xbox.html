<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CVJ · Conectando Xbox…</title>
<style>html,body{margin:0;height:100%;background:#0F0E13;color:#F3F2F7;font:16px system-ui,sans-serif;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<p>Conectando Xbox…</p>
<script>
  // URL de vuelta de la app de OpenXBL: llega con ?code=... Se guarda el código y se
  // vuelve a la app, que lo canjea en la función xbox (#conectar-xbox).
  (function () {
    var q = new URLSearchParams(location.search);
    var h = new URLSearchParams(location.hash.replace(/^#/, '').replace(/^[^?]*\?/, ''));
    var code = q.get('code') || h.get('code');
    try { if (code) localStorage.setItem('cvj.xbox.codigo', code); } catch (e) {}
    location.replace('./#conectar-xbox');
  })();
</script>
</body>
</html>
